<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de fornecedor</title>
    <link rel="stylesheet" href="../login como cliente/style.css">
</head>
<body>
    <form action="" method="post">
     <h1> Cadastro de Prestador de serviço</h1>

        <div>
            <input type="text" name="nome" placeholder="Nome:"><br>
            <input type="number" name="telefone" placeholder="Telefone:"><br>
            <input type="text" name="cpf" placeholder="CPF:"><br>
            <input type="text" name="cep" placeholder="CEP:"><br>
            <input type="text" name="cidade" placeholder="Cidade:"><br>
            <input type="select" name="estado" placeholder="Estado:"><br>
            <input type="text" name="endereco" placeholder="Endereço:"><br>
            <input type="number" name="numero" placeholder="Numero:"><br>
            <input type="select" name="cat_serv" placeholder="Categoria de serviço:"><br>
            <input type="text" name="descricao" placeholder="Descrição:"><br>
            <input type="text" name="email" placeholder="Email:"><br>
            <input type="password" name="senha" placeholder="Senha:"><br>
            <input type="password" name="Csenha" placeholder="Confirme sua senha:"><br>
            

        
            <button type="submit" class="btn">Cadastrar</button>
            <button type="reset" class="btn">Limpar</button>
            <a href="../index de cad-log/index de cadastro.html" class="btn-link">Voltar a escolha de cadastro</a>
        </div>
    </form>
</body>
</html>
