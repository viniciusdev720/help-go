<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpGo | Realizar Login</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <form id="formLogin">
        <h1>Realizar Login</h1>
        <p class="subtitle">Acesse sua conta para continuar</p>

        <input type="email" id="email" name="email" placeholder="E-mail" required> 
        <input type="password" id="senha" name="senha" placeholder="Senha" required>
        
        <div class="button-group">
            <button type="submit" class="btn">Fazer Login</button>
        </div>

        <p id="mensagem" class="mensagem"></p>

        <a href="./selecao-cadastro.html" class="btn-link">Não tem uma conta? Cadastre-se</a>
        <a href="../index.html" class="btn-link">← Voltar ao menu principal</a>
    </form>

    <!-- Configuração da API PHP -->
    <script src="../js/config/api-config.js"></script>
    <!-- Serviço de Autenticação -->
    <script src="../js/auth/auth-service.js"></script>
    <!-- Guardião de Rotas -->
    <script src="../js/auth/guard.js"></script>
    <!-- Lógica de Login -->
    <script src="../js/auth/login.js"></script>

</body>
</html>
