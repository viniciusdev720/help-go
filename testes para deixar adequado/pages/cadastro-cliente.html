<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpGo | Cadastro de Cliente</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <form id="formCadastroCliente">

        <h1>Cadastro de Cliente</h1>
        <p class="subtitle">Preencha seus dados para começar</p>

        <input type="text" id="nome" name="nome" placeholder="Nome Completo" required>
        <input type="tel" id="telefone" name="telefone" placeholder="Telefone / WhatsApp" required>
        <input type="text" id="cpf" name="cpf" placeholder="CPF" maxlength="14" required>
        <input type="text" id="cep" name="cep" placeholder="CEP (somente números)" maxlength="9" required>
        <input type="text" id="rua" name="rua" placeholder="Rua / Logradouro" readonly required>
        <input type="text" id="numero" name="numero" placeholder="Número" required>
        <input type="text" id="bairro" name="bairro" placeholder="Bairro" readonly required>
        <input type="text" id="cidade" name="cidade" placeholder="Cidade" readonly required>
        <input type="text" id="estado" name="estado" placeholder="Estado (UF)" readonly required>
        <input type="email" id="email" name="email" placeholder="E-mail" required>
        <input type="password" id="senha" name="senha" placeholder="Senha (mínimo 6 caracteres)" minlength="6" required>
        <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Confirme sua senha" minlength="6" required>

        <div class="button-group">
            <button type="submit" class="btn">Cadastrar</button>
            <button type="reset" class="btn btn-secondary-action">Limpar</button>
        </div>

        <p id="mensagem" class="mensagem"></p>

        <a href="./selecao-cadastro.html" class="btn-link">← Voltar a escolha de cadastro</a>

    </form>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Configuração do Supabase -->
    <script src="../js/supabase.js"></script>
    <!-- Script de Cadastro de Cliente -->
    <script src="../js/cadastro-cliente.js"></script>

</body>

</html>
