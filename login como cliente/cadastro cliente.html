<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de cliente</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <form id="formCadastroCliente">

        <h1>Cadastro de cliente</h1>

        <div>

            <!-- DADOS PESSOAIS -->

            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Nome:"
                required
            >
            <br>

            <input
                type="text"
                id="telefone"
                name="telefone"
                placeholder="Telefone:"
                required
            >
            <br>

            <input
                type="text"
                id="cpf"
                name="cpf"
                placeholder="CPF:"
                required
            >
            <br>


            <!-- ENDEREÇO -->

            <input
                type="text"
                id="cep"
                name="cep"
                placeholder="CEP:"
                maxlength="9"
                required
            >
            <br>

            <input
                type="text"
                id="cidade"
                name="cidade"
                placeholder="Cidade:"
                readonly
                required
            >
            <br>

            <input
                type="text"
                id="estado"
                name="estado"
                placeholder="Estado:"
                readonly
                required
            >
            <br>

            <input
                type="text"
                id="bairro"
                name="bairro"
                placeholder="Bairro:"
                readonly
                required
            >
            <br>

            <input
                type="text"
                id="rua"
                name="rua"
                placeholder="Rua:"
                readonly
                required
            >
            <br>

            <input
                type="text"
                id="numero"
                name="numero"
                placeholder="Número:"
                required
            >
            <br>


            <!-- LOGIN -->

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Email:"
                required
            >
            <br>

            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Senha:"
                required
                minlength="6"
            >
            <br>

            <input
                type="password"
                id="confirmarSenha"
                name="confirmarSenha"
                placeholder="Confirme sua senha:"
                required
                minlength="6"
            >
            <br>


            <!-- BOTÕES -->

            <button
                type="submit"
                class="btn"
            >
                Cadastrar
            </button>

            <button
                type="reset"
                class="btn"
            >
                Limpar
            </button>

            <a
                href="../index de cad-log/index de cadastro.html"
                class="btn-link"
            >
                Voltar a escolha de cadastro
            </a>

            <!-- MENSAGEM DO SISTEMA -->

            <p id="mensagem"></p>

        </div>

    </form>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../supabase.js"></script>

    <!-- JAVASCRIPT DO CADASTRO -->

    <script src="cadastro-cliente.js"></script>

</body>

</html>
